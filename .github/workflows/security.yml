# Security scanning (SECURITY.md "SAST, dependency, secret and IaC scanning in CI").
name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: gitleaks
        run: >-
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1
          git /repo --config /repo/.gitleaks.toml --redact --exit-code 1 --report-format sarif
          --report-path /repo/gitleaks.sarif
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: gitleaks, path: gitleaks.sarif }

  sast:
    name: SAST (semgrep)
    runs-on: ubuntu-24.04
    container: { image: 'semgrep/semgrep:1.179.0' }
    steps:
      - uses: actions/checkout@v7
      - name: rule self-tests
        run: semgrep --test tests/semgrep/ --metrics=off
      - run: >-
          semgrep scan --metrics=off --error
          --config p/default --config p/typescript --config p/nodejsscan --config p/secrets
          --config .semgrep/ --exclude tests/semgrep --sarif --output semgrep.sarif
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: semgrep, path: semgrep.sarif }

  codeql:
    name: SAST (CodeQL)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with: { languages: javascript-typescript, queries: security-extended }
      - uses: github/codeql-action/analyze@v3

  dependencies:
    name: dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with: { version: '10.28.0' }
      - uses: actions/setup-node@v5
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: production dependencies (blocking)
        run: pnpm audit --prod --audit-level high
      - name: all dependencies (report)
        run: pnpm audit --audit-level moderate --json > audit-all.json || echo "dev-dependency advisories recorded in audit-all.json"
      - name: licence and SBOM
        run: npx --yes @cyclonedx/cdxgen@11 -t js -o sbom.cdx.json .
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-and-audit
          path: |
            sbom.cdx.json
            audit-all.json

  iac:
    name: IaC scan (checkov)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with: { python-version: '3.11' }
      - run: pip install checkov==3.3.22
      - run: checkov -d . --framework terraform,github_actions,dockerfile,secrets --skip-path node_modules --skip-path apps/mobile/android --skip-path apps/mobile/ios --compact --quiet
