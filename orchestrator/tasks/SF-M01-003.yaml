acceptance_tests:
- Outbox and inbox tables are created from contracts/shared/sql/outbox.template.sql without any grant or column changes (ADR-0006 condition 9; tightening needs a Contract Change Request)
- ADR-0006: NOLOGIN role sf_cmp031_rw receives this component's DML and sequence use; sf_app has no generic DML on CMP-031 authoritative tables; RLS policies remain TO sf_app
- ADR-0006: runtime LOGIN inherits only sf_app and sf_cmp031_rw; NOSUPERUSER NOBYPASSRLS; not the table/schema owner (owner is sf_migrator or equivalent)
- ADR-0006: TENANT_SCOPED tables ENABLE + FORCE RLS; grants do not replace tenant RLS
- ADR-0006: PUBLIC and default privileges do not recreate broad access on new tables/sequences
- ADR-0006: no SELECT/INSERT/UPDATE/DELETE granted to another component; cross-component SQL default DENY
- 'ADR-0006 privilege-boundary suite as the CMP-031 runtime LOGIN: own authorized DML succeeds; wrong-tenant ops fail through RLS; another component SELECT/INSERT/UPDATE/DELETE fail; SET ROLE / membership in sf_cmp002_rw, sf_cmp037_rw, sf_cmp038_rw, sf_cmp048_rw unavailable; rolbypassrls false; runtime login is not table owner'
- New migration files are named with a timestamp after 1759490000000 (check-order)
- POST /internal/audit-events, GET /audit, GET /audit/{resourceType}/{id} per Eng v1.4 CMP-031; records valid against SF-CON-AUDIT-EVENT
- 'Append-only: UPDATE and DELETE on audit_event are refused for sf_app (test)'
- 'Tamper evidence: per-tenant hash chain; a modified historical row is detected by the verify routine'
- Every record carries tenant, cell, actor, trace and classification; wrong-tenant query returns nothing; privileged cross-tenant
  read is itself audited
- 'PII guard: fields outside the audit schema allow-list are rejected, not stored'
- Duplicate audit event (same event id) stored once
- 'Audit sink unavailable: producer path follows the documented outbox retry, no lost record in the failure test'
- audit_event partitioned by time; migration round trip passes
- pnpm format:check && pnpm lint && pnpm typecheck
- pnpm test (unit, contract and failure-path tests for this task)
- service integration suite against disposable PostgreSQL 16 (services/<cmp>/vitest.integration.config.ts)
- pnpm gates (migration_lint, contracts_lock_gate, hardcoding_gate, agent_rules_gate, codeowners_gate)
- python scripts/gates/check_scope.py --envelope orchestrator/tasks/<task>.yaml --base origin/main
- pnpm deps:graph (no component-to-component imports, no cycles)
- gitleaks and semgrep clean on the diff
