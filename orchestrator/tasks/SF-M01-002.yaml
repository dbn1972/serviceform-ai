acceptance_tests:
- Outbox and inbox tables are created from contracts/shared/sql/outbox.template.sql without any grant or column changes (ADR-0006 condition 9; tightening needs a Contract Change Request)
- ADR-0006: NOLOGIN role sf_cmp048_rw receives this component's DML and sequence use; sf_app has no generic DML on CMP-048 authoritative tables; RLS policies remain TO sf_app
- ADR-0006: runtime LOGIN inherits only sf_app and sf_cmp048_rw; NOSUPERUSER NOBYPASSRLS; not the table/schema owner (owner is sf_migrator or equivalent)
- ADR-0006: TENANT_SCOPED tables ENABLE + FORCE RLS; grants do not replace tenant RLS
- ADR-0006: PUBLIC and default privileges do not recreate broad access on new tables/sequences
- ADR-0006: no SELECT/INSERT/UPDATE/DELETE granted to another component; cross-component SQL default DENY
- 'ADR-0006 privilege-boundary suite as the CMP-048 runtime LOGIN: own authorized DML succeeds; wrong-tenant ops fail through RLS; another component SELECT/INSERT/UPDATE/DELETE fail; SET ROLE / membership in sf_cmp002_rw, sf_cmp031_rw, sf_cmp037_rw, sf_cmp038_rw unavailable; rolbypassrls false; runtime login is not table owner'
- New migration files are named with a timestamp after 1759490000000 (check-order)
- packages/security exposes a Fastify plugin that builds the request context from a verified principal and an OPA PEP client
  returning SF-CON-AUTHZ-DECISION
- 'Deny by default: missing policy, missing context or unknown action is denied'
- 'Fail closed: OPA unavailable or timing out denies privileged actions (fault-injection test)'
- OPA bundle under policy/opa with Rego unit tests (opa test) covering role, tenant, jurisdiction and delegation deny cases
- Secrets/KMS adapter interface with a local implementation; no secret value reaches logs (redaction test)
- privileged_access_record and security_policy_metadata tables with isolation classes and RLS where tenant-scoped
- SecurityPolicyPublished and SecurityIncidentDetected events valid against SF-CON-EVENT-ENVELOPE
- Decision latency p99 recorded for the local decision path (evidence, not a gate yet)
- pnpm format:check && pnpm lint && pnpm typecheck
- pnpm test (unit, contract and failure-path tests for this task)
- service integration suite against disposable PostgreSQL 16 (services/<cmp>/vitest.integration.config.ts)
- pnpm gates (migration_lint, contracts_lock_gate, hardcoding_gate, agent_rules_gate, codeowners_gate)
- python scripts/gates/check_scope.py --envelope orchestrator/tasks/<task>.yaml --base origin/main
- pnpm deps:graph (no component-to-component imports, no cycles)
- gitleaks and semgrep clean on the diff
