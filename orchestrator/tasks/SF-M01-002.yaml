stop_conditions:
- any FROZEN contract change required (raise a Contract Change Request; do not edit contracts/**)
- architecture or statutory ambiguity
- tenant/security boundary change
- new infrastructure, database, workflow engine or design system
- a write outside allowed_write_paths is needed
- a dependency on another wave task's unmerged code is needed
- mandatory evidence failure or any hard-gate failure (BLOCKED_CRITICAL_GATE)
- second failed verification on a Sonnet route (escalate to Opus per MODEL-ROUTING-QUALITY.md s7)
- a token issuer or identity store is needed (CMP-004, M02)
- a statutory business rule would be encoded in Rego (belongs to GoRules/CMP-008)
- a policy pinning model is needed beyond AWS v1.7 s20.3 (pinned vs effective-latest ambiguity, verification report)
- ADR-0006 condition 1-10 violated (including granting another component SQL access without a new ADR, or editing frozen outbox grants)
- a pnpm-lock.yaml change is required (request orchestrator lockfile reconciliation; do not commit the lockfile)
- a write to infra/local/docker-compose.yml is required (P-002-1 remains an owner exception; start authenticated OPA from this task's test harness instead)
