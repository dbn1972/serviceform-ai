acceptance_tests:
- Outbox and inbox tables are created from contracts/shared/sql/outbox.template.sql without any grant or column changes (ADR-0006 condition 9; tightening needs a Contract Change Request)
- ADR-0006: NOLOGIN role sf_cmp037_rw receives this component's DML and sequence use; sf_app has no generic DML on CMP-037 authoritative tables; RLS policies remain TO sf_app
- ADR-0006: runtime LOGIN inherits only sf_app and sf_cmp037_rw; NOSUPERUSER NOBYPASSRLS; not the table/schema owner (owner is sf_migrator or equivalent)
- ADR-0006: TENANT_SCOPED tables ENABLE + FORCE RLS; grants do not replace tenant RLS
- ADR-0006: PUBLIC and default privileges do not recreate broad access on new tables/sequences
- ADR-0006: no SELECT/INSERT/UPDATE/DELETE granted to another component; cross-component SQL default DENY
- 'ADR-0006 privilege-boundary suite as the CMP-037 runtime LOGIN: own authorized DML succeeds; wrong-tenant ops fail through RLS; another component SELECT/INSERT/UPDATE/DELETE fail; SET ROLE / membership in sf_cmp002_rw, sf_cmp031_rw, sf_cmp038_rw, sf_cmp048_rw unavailable; rolbypassrls false; runtime login is not table owner'
- New migration files are named with a timestamp after 1759490000000 (check-order)
- 'Connector SPI in packages/connector-sdk: invoke, webhook verify, health; modes REAL | SANDBOX | SIMULATED from SF-CON-CONNECTOR-BINDING'
- Production profile refuses to start when a critical connector binding is SIMULATED (fail closed test)
- Simulated responses carry SF-CON-SIMULATION-MARKER and a test_run_id
- connector_definition, connector_binding (tenant/service scoped, RLS), connector_transaction tables; wrong-tenant binding
  lookup returns nothing
- Credentials are referenced by secret handle only; no secret in DB rows, logs or responses
- Duplicate webhook callback (same provider reference) produces one connector_transaction and one event
- Provider timeout triggers retry with backoff then circuit-open; ConnectorInvocationFailed emitted
- No outbound call inside an open DB transaction (test asserts transaction state at call time)
- A reference echo simulator in simulators/framework exercises the full path; no provider-specific simulator yet
- pnpm format:check && pnpm lint && pnpm typecheck
- pnpm test (unit, contract and failure-path tests for this task)
- service integration suite against disposable PostgreSQL 16 (services/<cmp>/vitest.integration.config.ts)
- pnpm gates (migration_lint, contracts_lock_gate, hardcoding_gate, agent_rules_gate, codeowners_gate)
- python scripts/gates/check_scope.py --envelope orchestrator/tasks/<task>.yaml --base origin/main
- pnpm deps:graph (no component-to-component imports, no cycles)
- gitleaks and semgrep clean on the diff
