acceptance_tests:
- packages/outbox implements the publisher protocol of contracts/shared/sql/outbox.template.sql rules 3-6 (lease claim, publish
  outside any transaction, per-key seq order, dead-letter holds its key)
- New migration files are named with a timestamp after 1759490000000 (check-order)
- packages/outbox writes an event row in the caller's transaction using the frozen SF-CON-OUTBOX shape; rollback leaves no
  event (test)
- Relay publishes to Kafka (local compose broker) after commit; at-least-once with event_id de-duplication on the consumer
  side
- Every published event validates against SF-CON-EVENT-ENVELOPE; an invalid event goes to a DLQ, not the topic
- Topic registry and schema metadata with version checks; an incompatible schema version fails explicitly
- Partition key preserves per-aggregate ordering (test with interleaved aggregates)
- Relay never reads business tables, only outbox tables per the frozen contract
- Consumer checkpoint metadata and lag metric exposed through packages/observability
- 'Broker down: relay backs off, no event lost, ordering preserved after recovery (fault test)'
- pnpm format:check && pnpm lint && pnpm typecheck
- pnpm test (unit, contract and failure-path tests for this task)
- service integration suite against disposable PostgreSQL 16 (services/<cmp>/vitest.integration.config.ts)
- pnpm gates (migration_lint, contracts_lock_gate, hardcoding_gate, agent_rules_gate, codeowners_gate)
- python scripts/gates/check_scope.py --envelope orchestrator/tasks/<task>.yaml --base 684b443
- pnpm deps:graph (no component-to-component imports, no cycles)
- gitleaks and semgrep clean on the diff
required_evidence:
- evidence/SF-M01-004/outbox-atomicity.log
- evidence/SF-M01-004/broker-outage.log
- evidence/SF-M01-004/ordering.log
- evidence/<task>/EVIDENCE.md with commit SHA, resolved model and effort, commands and results
- evidence/<task>/junit/*.xml for unit and integration runs
- evidence/<task>/coverage-summary.json (>=80% lines on new src)
- evidence/<task>/scope-check.log and gates.log
- 'orchestrator/handovers/<task>.yaml (handoff: commit, tests, evidence, risks, blockers)'
hard_gates:
- frozen_contract_conformance (100%)
- cross_tenant_leakage (zero)
- unresolved_critical_security (zero)
- lost_committed_applications (zero lost events in failure tests; proxy for the M05 gate)
stop_conditions:
- any FROZEN contract change required (raise a Contract Change Request; do not edit contracts/**)
- architecture or statutory ambiguity
- tenant/security boundary change
- new infrastructure, database, workflow engine or design system
- a write outside allowed_write_paths is needed
- a dependency on another wave task's unmerged code is needed
- mandatory evidence failure or any hard-gate failure (BLOCKED_CRITICAL_GATE)
- second failed verification on a Sonnet route (escalate to Opus per MODEL-ROUTING-QUALITY.md s7)
- the relay would need cross-component SQL beyond the frozen outbox contract
- SQS vs MSK selection per event class is needed (architecture decision)
- large binary payloads would go on events
