acceptance_tests:
- Outbox and inbox tables are created from contracts/shared/sql/outbox.template.sql without changes; RLS policies use sf_platform.current_tenant_id()
- New migration files are named with a timestamp after 1759490000000 (check-order)
- 'Eng v1.4 CMP-002 interfaces: GET /tenants/{id}, GET/POST /organisations, GET /offices, POST /admin/tenant-bindings; responses
  and errors validate against frozen schemas'
- Tables tenant, organisation, organisation_relation, office, tenant_cell_binding declared with sf:isolation; tenant-scoped
  tables have tenant_id NOT NULL, ENABLE + FORCE RLS and policies on app.tenant_id
- 'RLS negative matrix as sf_app: wrong tenant read/insert/update/delete returns zero rows or is refused; unset tenant context
  returns zero rows'
- Tenant id taken only from the server-derived request context, never from a client header (test sends a forged header and
  is refused)
- Platform-operator tenant creation runs a privileged path that writes an audit event (SF-CON-AUDIT-EVENT) and is denied for
  tenant roles
- TenantCreated, OrganisationChanged, OfficeActivated, TenantIsolationClassChanged written to the outbox in the same transaction
  as the state change and valid against SF-CON-EVENT-ENVELOPE
- POST /organisations with a repeated Idempotency-Key creates one row and returns the original response
- Organisation hierarchy changes are versioned and effective-dated; past versions are not mutated
- Migration up/down round trip passes
- pnpm format:check && pnpm lint && pnpm typecheck
- pnpm test (unit, contract and failure-path tests for this task)
- service integration suite against disposable PostgreSQL 16 (services/<cmp>/vitest.integration.config.ts)
- pnpm gates (migration_lint, contracts_lock_gate, hardcoding_gate, agent_rules_gate, codeowners_gate)
- python scripts/gates/check_scope.py --envelope orchestrator/tasks/<task>.yaml --base 684b443
- pnpm deps:graph (no component-to-component imports, no cycles)
- gitleaks and semgrep clean on the diff
