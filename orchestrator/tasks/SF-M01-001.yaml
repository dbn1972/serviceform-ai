- tenant/security boundary change
- new infrastructure, database, workflow engine or design system
- a write outside allowed_write_paths is needed
- a dependency on another wave task's unmerged code is needed
- mandatory evidence failure or any hard-gate failure (BLOCKED_CRITICAL_GATE)
