# ServiceForm AI local development infrastructure (DEVELOPMENT.md stack baseline).
# Local only: every port binds to 127.0.0.1 and every credential comes from infra/local/.env,
# generated by scripts/dev/init-local-env.sh (gitignored). Nothing here is used in AWS,
# where the managed equivalents in AWS v1.7 s2 apply (Aurora, ElastiCache, OpenSearch, MSK, S3).
name: serviceform-local

x-healthcheck: &hc
  interval: 10s
  timeout: 5s
  retries: 12

services:
  postgres:
    image: postgres:16.14-alpine
    environment:
      POSTGRES_USER: ${SF_LOCAL_PG_USER:?run scripts/dev/init-local-env.sh}
      POSTGRES_PASSWORD: ${SF_LOCAL_PG_PASSWORD:?run scripts/dev/init-local-env.sh}
      POSTGRES_DB: serviceform
    ports: ['127.0.0.1:5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      <<: *hc
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d serviceform']

  redis:
    image: redis:8.10.2-alpine
    command: ['redis-server', '--requirepass', '${SF_LOCAL_REDIS_PASSWORD:?run scripts/dev/init-local-env.sh}', '--appendonly', 'no']
    ports: ['127.0.0.1:6379:6379']
    healthcheck:
      <<: *hc
      test: ['CMD-SHELL', 'redis-cli -a "$$SF_LOCAL_REDIS_PASSWORD" --no-auth-warning ping | grep PONG']
    environment:
      SF_LOCAL_REDIS_PASSWORD: ${SF_LOCAL_REDIS_PASSWORD}

  opensearch:
    image: opensearchproject/opensearch:3.9.0
    environment:
      discovery.type: single-node
      # Local only. Managed OpenSearch in AWS runs with fine-grained access control.
      DISABLE_SECURITY_PLUGIN: 'true'
      DISABLE_INSTALL_DEMO_CONFIG: 'true'
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ports: ['127.0.0.1:9200:9200']
    healthcheck:
      <<: *hc
      test: ['CMD-SHELL', 'curl -fs http://localhost:9200/_cluster/health || exit 1']

  s3:
    # S3-compatible object storage emulator (AWS v1.7 s2: S3-compatible object access).
    image: localstack/localstack:4.14
    environment:
      SERVICES: s3,kms
      AWS_DEFAULT_REGION: ${SF_LOCAL_AWS_REGION:-us-east-1}
    ports: ['127.0.0.1:4566:4566']
    healthcheck:
      <<: *hc
      test: ['CMD-SHELL', 'curl -fs http://localhost:4566/_localstack/health | grep -q "\"s3\": \"\(available\|running\)\""']

  kafka:
    # Kafka-compatible event backbone (MSK in AWS).
    image: redpandadata/redpanda:v26.2.3
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://kafka:9092,external://localhost:19092
    ports: ['127.0.0.1:19092:19092']
    healthcheck:
      <<: *hc
      test: ['CMD-SHELL', 'rpk cluster health | grep -q "Healthy:.*true"']

  temporal:
    image: temporalio/auto-setup:1.29.7
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_SEEDS: postgres
      POSTGRES_USER: ${SF_LOCAL_PG_USER}
      POSTGRES_PWD: ${SF_LOCAL_PG_PASSWORD}
    ports: ['127.0.0.1:7233:7233']

  temporal-ui:
    image: temporalio/ui:2.55.0
    depends_on: [temporal]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports: ['127.0.0.1:8233:8080']

  opa:
    image: openpolicyagent/opa:1.21.1-static
    command: ['run', '--server', '--addr=0.0.0.0:8181', '--log-level=info', '/policy']
    volumes: ['../../policy/opa:/policy:ro']
    ports: ['127.0.0.1:8181:8181']

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.161.0
    command: ['--config=/etc/otelcol/config.yaml']
    volumes: ['./otel-collector.yaml:/etc/otelcol/config.yaml:ro']
    ports: ['127.0.0.1:4317:4317', '127.0.0.1:4318:4318']
    depends_on: [jaeger]

  jaeger:
    image: jaegertracing/jaeger:2.21.0
    ports: ['127.0.0.1:16686:16686']

volumes:
  pgdata: {}
