execution_model: dependency-aware multi-agent orchestration with frozen contracts
  and non-overlapping write scopes
concurrency_groups:
- id: CG-01
  after:
  - M01
  parallel_modules:
  - M02
  - M03
  rule: Identity/Profile and Catalogue/Studio may proceed concurrently against frozen
    tenant/identity contracts.
- id: CG-02
  after:
  - M05
  parallel_modules:
  - M06
  - M08
  rule: Payments/integration and Search/AI/Analytics may proceed concurrently against
    stable case events.
