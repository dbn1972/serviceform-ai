# Executable build sequence per ADR-0001 (ACCEPTED 3 October 2026). Architecture rules are
# unchanged; only scheduling changed from the v2.3 plan, which is in git history.
version: '2.5-adr0001'
platform: ServiceForm AI
principle: Build one bounded module at a time; certify evidence before advancing.
adr: docs/adr/ADR-0001-canonical-build-sequence.md
dependency_rules:
  hard:
    - Platform backbone (CMP-002, 003, 031, 032, 036, 037, 038, 047, 048, 055) is built before any consumer.
    - CMP-039 AI Gateway is built before any component that calls a model (AI-GOVERNANCE.md).
    - Every component is owned by exactly one module; every INT contract has exactly one owning module.
  peer_allowed:
    - External connector components (CMP-012, 021, 025, 026) may be consumed earlier through a FROZEN adapter contract and SIMULATED adapter (Eng v1.4 s10, INT-013).
    - AI-assist edges from non-AI components to AI components are optional assistance (Eng v1.4 s6.1) and never block a module.
    - Other mutual peers are consumed through FROZEN contracts recorded in orchestrator/contracts-lock.yaml.
modules:
- id: M00
  name: Architecture Verification and Repository Bootstrap
  depends_on: []
  deliverables:
  - docs/audits/ARCHITECTURE-VERIFICATION-001.md
  - monorepo skeleton
  - CI quality gates incl. scripts/validate_specs.py and CODEOWNERS
  - local docker/dev environment
  - FROZEN shared envelopes (tenant context, event, error, idempotency, audit, OPA decision, connector adapter SPI)
  exit_gate: G1_BUILD_READY
- id: M01
  name: Foundation, Tenancy, Jurisdiction, Security and Platform Backbone
  depends_on: [M00]
  components: [CMP-002, CMP-003, CMP-030, CMP-031, CMP-032, CMP-036, CMP-037, CMP-038, CMP-047, CMP-048, CMP-055]
  integrations: []
  exit_gate: G4_SECURITY_VERIFIED
- id: M02
  name: Identity and Citizen Profile
  depends_on: [M01]
  components: [CMP-004, CMP-005]
  integrations: [INT-001]
  exit_gate: G3_INTEGRATION_VERIFIED
- id: M03
  name: Catalogue, Versioning, Tenant Service Binding, Studio and UX4G Foundation
  depends_on: [M01]
  components: [CMP-001, CMP-033, CMP-034, CMP-050, CMP-051, CMP-052, CMP-053, CMP-054]
  integrations: [INT-002]
  cross_cutting:
  - UX4G Design System 3.0 baseline and renderer/theming foundation
  exit_gate: G3_INTEGRATION_VERIFIED
- id: M04
  name: Forms, Rules, Evidence, Upload, Document Intelligence and AI Gateway
  depends_on: [M02, M03]
  components: [CMP-008, CMP-009, CMP-011, CMP-013, CMP-014, CMP-039]
  integrations: []
  exit_gate: G3_INTEGRATION_VERIFIED
- id: M05
  name: Application, Case, Workflow, Tasks, Verification, Deficiency, SLA, Grievance and Appeal
  depends_on: [M04]
  components: [CMP-015, CMP-016, CMP-017, CMP-018, CMP-019, CMP-027, CMP-028, CMP-029]
  integrations: [INT-004, INT-005, INT-006, INT-009]
  exit_gate: G4_SECURITY_VERIFIED
- id: M06
  name: Fees, Payments, Notifications and Messaging
  depends_on: [M05]
  components: [CMP-020, CMP-021, CMP-025, CMP-026]
  integrations: [INT-007]
  exit_gate: G3_INTEGRATION_VERIFIED
- id: M07
  name: Credentials, QR, Revocation and DigiLocker
  depends_on: [M06]
  components: [CMP-012, CMP-022, CMP-023, CMP-024]
  integrations: [INT-008]
  exit_gate: G3_INTEGRATION_VERIFIED
- id: M08
  name: Search, Discovery, Recommendation, Analytics, Operations and Retention
  depends_on: [M05]
  components: [CMP-006, CMP-007, CMP-035, CMP-045, CMP-046, CMP-049]
  integrations: [INT-003, INT-010]
  exit_gate: G3_INTEGRATION_VERIFIED
- id: M09
  name: World-Class Interoperability, Omnichannel, Integrity and Trust
  depends_on: [M05, M07, M08]
  components: [CMP-056, CMP-057, CMP-058, CMP-059, CMP-060, CMP-061]
  integrations: [INT-014, INT-015, INT-016, INT-017, INT-018, INT-019]
  cross_cutting:
  - BPMN 2.0 import/export profile
  - signed .sfpackage promotion
  - long-running workflow/config migration
  - AI model/prompt/tool/evaluation governance
  exit_gate: G4_SECURITY_VERIFIED
- id: M10
  name: Golden Residence Certificate Certification
  depends_on: [M07, M08]
  deliverables:
  - canonical residence service template (IND-SOC-002) + tenant overlay + published TenantServiceBinding
  - full E2E, tenant isolation, performance (G5) and UX4G evidence
  inputs_required_from_owner:
  - pilot tenant/State, legal basis, eligibility, evidence, fee, SLA anchors, credential template (Finding M-04)
  exit_gate: G6_RELEASE_CERTIFIED
- id: M11
  name: Reuse Proof with Second Service
  depends_on: [M10]
  deliverables:
  - second service (Eng v1.4 example: Income Certificate; owner to confirm) configured through Studio metadata and published as a TenantServiceBinding
  - second-service E2E suite on the generic engines (same scenario classes as the golden suite)
  - delta capability report listing every non-metadata change with its approved capability-gap ADR
  rule: No bespoke service backend unless approved reusable capability gap is documented.
  exit_criteria:
  - second-service E2E suite passes 100% on the release candidate
  - no new services/** code specific to the second service; every engine change traces to an accepted capability-gap ADR
  - tenant isolation and authorization regression suites still pass
  note: G3 certifies the reuse proof. Releasing the second service to production is a separate G6 decision.
  exit_gate: G3_INTEGRATION_VERIFIED
- id: M12
  name: AI Assistants and Agents
  depends_on: [M10]
  components: [CMP-010, CMP-040, CMP-041, CMP-042, CMP-043, CMP-044]
  integrations: [INT-012]
  exit_gate: G4_SECURITY_VERIFIED
cross_cutting_integrations:
- id: INT-011
  owner: M01
  rule: Tenant isolation chain; owned by M01 and re-verified at every module exit gate for the layers that module adds.
- id: INT-013
  owner: M01
  rule: External dependency simulation contract; adapter SPI owned by M01 (CMP-037); each connector module re-verifies its REAL/SANDBOX/SIMULATED modes.
execution_model: dependency-aware multi-agent orchestration with frozen contracts and non-overlapping write scopes
concurrency_groups:
- {id: CG-01, after: [M01], parallel_modules: [M02, M03]}
- {id: CG-02, after: [M05], parallel_modules: [M06, M08]}
- {id: CG-03, after: [M07, M08], parallel_modules: [M09, M10]}
- {id: CG-04, after: [M10], parallel_modules: [M11, M12]}
