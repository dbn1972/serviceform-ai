# IND-SOC-002 — GoRules (Odisha public portal sample)
# Eligibility from https://edistrict.odisha.gov.in/ Resident Certificate text.
# Fee = 0 government service charge. Not LLM-evaluated. Not CERTIFIED. Not G6.

rule_set_id: ind-soc-002-rules-v1
engine: GORULES
version: "0.2.0-odisha-sample"
immutable_after_publish: true
invented_statutory_policy_forbidden: true
policy_input_required: false
policy_source_url: "https://edistrict.odisha.gov.in/"

nodes:
  - id: eligibility_check
    kind: DECISION_TABLE
    description: >
      Continuous residence ≥ 12 months in concerned Tahasil, or documented
      relaxation (transferred govt employee / woman married within past 1 year).
    inputs:
      - field: residence_duration_months
        type: integer
      - field: relaxation_code
        type: string
    outputs:
      - field: is_eligible
        type: boolean
      - field: ineligibility_reason
        type: string
    rows:
      - condition: "residence_duration_months >= 12"
        result: { is_eligible: true, ineligibility_reason: "" }
      - condition: "relaxation_code == 'TRANSFERRED_GOVT_EMPLOYEE_WITHIN_1_YEAR'"
        result: { is_eligible: true, ineligibility_reason: "" }
      - condition: "relaxation_code == 'WOMAN_MARRIED_WITHIN_1_YEAR'"
        result: { is_eligible: true, ineligibility_reason: "" }
      - condition: "true"
        result:
          {
            is_eligible: false,
            ineligibility_reason: "Continuous residence of at least one year within the concerned Tahasil is required (edistrict.odisha.gov.in), unless a published relaxation applies",
          }

  - id: completeness_check
    kind: FUNCTION
    description: Check required fields present and at least one evidence ref
    inputs:
      - field: supporting_evidence_refs
        type: array
    outputs:
      - field: is_complete
        type: boolean
      - field: missing_fields
        type: array

  - id: fee_calculation
    kind: DECISION_TABLE
    description: Odisha portal — no Government Service charge
    inputs:
      - field: applicant_category
        type: string
    outputs:
      - field: fee_amount_paisa
        type: integer
      - field: fee_waiver_reason
        type: string
    rows:
      - condition: "true"
        result:
          {
            fee_amount_paisa: 0,
            fee_waiver_reason: "No Government Service charge (edistrict.odisha.gov.in)",
          }

edges:
  - from: eligibility_check
    to: completeness_check
    condition: "is_eligible == true"
  - from: eligibility_check
    to: REJECT_INELIGIBLE
    condition: "is_eligible == false"
  - from: completeness_check
    to: fee_calculation
    condition: "is_complete == true"
  - from: completeness_check
    to: DEFICIENCY_NOTICE
    condition: "is_complete == false"
