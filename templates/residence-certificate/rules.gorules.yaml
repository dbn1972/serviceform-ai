# IND-SOC-002 — GoRules deterministic rule set (POLICY_INPUT_REQUIRED)
# These rules execute via GoRules engine (Constitution §7). Not LLM-evaluated.
# Statutory eligibility thresholds, minimum duration, fee waivers, and document
# requirements are POLICY_INPUT_REQUIRED — the statutory owner must supply them.
# Do NOT invent residence statute, eligibility criteria, or fee thresholds.
# No final approval/rejection decision may be made by an AI/LLM (Constitution §20).

rule_set_id: ind-soc-002-rules-v1
engine: GORULES
version: "0.1.0-candidate"
immutable_after_publish: true
invented_statutory_policy_forbidden: true
policy_input_required: true

nodes:
  # ELIGIBILITY GATE — statutory threshold POLICY_INPUT_REQUIRED
  - id: eligibility_check
    kind: DECISION_TABLE
    description: >
      Determine if applicant meets residence eligibility. Minimum duration, age, and
      other criteria are POLICY_INPUT_REQUIRED from statutory owner.
    inputs:
      - field: residence_duration_months
        type: integer
      - field: applicant_dob
        type: date
    outputs:
      - field: is_eligible
        type: boolean
      - field: ineligibility_reason
        type: string
    rows:
      # POLICY_INPUT_REQUIRED — statutory owner supplies minimum residence duration and age
      - condition: "residence_duration_months >= POLICY_INPUT_REQUIRED_MIN_MONTHS"
        result: { is_eligible: true, ineligibility_reason: "" }
      - condition: "residence_duration_months < POLICY_INPUT_REQUIRED_MIN_MONTHS"
        result: { is_eligible: false, ineligibility_reason: "POLICY_INPUT_REQUIRED_INELIGIBILITY_MESSAGE" }

  # COMPLETENESS CHECK — form completeness before routing
  - id: completeness_check
    kind: FUNCTION
    description: Check all required fields present and evidence refs non-empty
    inputs:
      - field: supporting_evidence_refs
        type: array
    outputs:
      - field: is_complete
        type: boolean
      - field: missing_fields
        type: array

  # FEE CALCULATION — POLICY_INPUT_REQUIRED
  - id: fee_calculation
    kind: DECISION_TABLE
    description: >
      Calculate applicable fee. Fee structure is POLICY_INPUT_REQUIRED from statutory owner.
      GoRules evaluates deterministically; no LLM involvement.
    inputs:
      - field: applicant_category
        type: string
    outputs:
      - field: fee_amount_paisa
        type: integer
      - field: fee_waiver_reason
        type: string
    rows:
      # POLICY_INPUT_REQUIRED — fee schedule supplied by statutory owner (may be zero)
      - condition: "applicant_category == 'POLICY_INPUT_REQUIRED_CATEGORY'"
        result: { fee_amount_paisa: "POLICY_INPUT_REQUIRED_AMOUNT", fee_waiver_reason: "" }
      - condition: "true"
        result: { fee_amount_paisa: "POLICY_INPUT_REQUIRED_DEFAULT_AMOUNT", fee_waiver_reason: "" }

edges:
  - from: eligibility_check
    to: completeness_check
    condition: "is_eligible == true"
  - from: eligibility_check
    to: REJECT_INELIGIBLE
    condition: "is_eligible == false"
  - from: completeness_check
    to: fee_calculation
    condition: "is_complete == true"
  - from: completeness_check
    to: DEFICIENCY_NOTICE
    condition: "is_complete == false"
