# IND-SOC-002 — Credential Template (POLICY_INPUT_REQUIRED)
# Constitution §18: APPROVED → SIGNING_PENDING → ISSUED → CLOSED.
# Credential content, validity period, issuing authority designation, and eSign policy are
# POLICY_INPUT_REQUIRED from statutory owner. Do NOT invent.
# Artifact bytes stored as storage-key + SHA-256 only (Constitution §5).
# CMP-022 handles generation/signing/issuance; CMP-024 handles registry status.
# DigiLocker publish failure does NOT reverse issuance (Constitution §18).

credential_template_id: ind-soc-002-credential-v1
catalogue_id: IND-SOC-002
version: "0.1.0-candidate"
immutable_after_publish: true
invented_statutory_policy_forbidden: true
policy_input_required: true

output_format: PDF_A          # primary delivery format
secondary_format: XML         # machine-readable copy; POLICY_INPUT_REQUIRED if different

esign_policy:
  required: true
  provider_connector: SF-CON-SIGNING-RECORD    # FROZEN contract consumed
  signing_authority_role: "POLICY_INPUT_REQUIRED"
  legal_basis_ref: "POLICY_INPUT_REQUIRED"

validity:
  validity_period_days: "POLICY_INPUT_REQUIRED"
  renewable: "POLICY_INPUT_REQUIRED"

certificate_fields:
  # POLICY_INPUT_REQUIRED — statutory owner supplies the authoritative field list
  - field_id: CERT_HOLDER_NAME
    source: form.applicant_name
    display_label: "Name of Certificate Holder"
  - field_id: CERT_DOB
    source: form.applicant_dob
    display_label: "Date of Birth"
  - field_id: CERT_GENDER
    source: form.applicant_gender
    display_label: "Gender"
  - field_id: CERT_ADDRESS
    source: form.residence_address
    display_label: "Address of Ordinary Residence"
  - field_id: CERT_ISSUING_AUTHORITY
    source: workflow.approver_decision.assignment.organisation
    display_label: "POLICY_INPUT_REQUIRED"
  - field_id: CERT_ISSUE_DATE
    source: system.issuance_timestamp
    display_label: "Date of Issue"
  - field_id: CERT_VALID_UNTIL
    source: computed.valid_until
    display_label: "Valid Until"
  - field_id: CERT_LEGAL_BASIS
    source: "POLICY_INPUT_REQUIRED"
    display_label: "POLICY_INPUT_REQUIRED"
  - field_id: CERT_QR_CODE
    source: system.verification_token
    display_label: "Verification QR / URL"
    contract: SF-CON-VERIFICATION-TOKEN

digilocker_publish:
  contract: SF-CON-DIGILOCKER-PUBLISH
  doc_type: "POLICY_INPUT_REQUIRED"    # DigiLocker document type code; owner must supply
  failure_does_not_reverse_issuance: true

registry_ack_required_before_issued: true
registry_component: CMP-024
