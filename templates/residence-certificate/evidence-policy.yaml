technical_acceptance_state:
  pending: UPLOADED_PENDING_SCAN
  accepted: TECHNICALLY_ACCEPTED
  rejected: TECHNICALLY_REJECTED

business_verification_state:
  pending: PENDING_OFFICER_REVIEW
  verified: VERIFIED
  queried: DEFICIENCY_RAISED
  rejected: REJECTED
