# IND-SOC-002 — Evidence Policy (Odisha public portal sample)
# Documents listed on https://edistrict.odisha.gov.in/ Resident Certificate page.
# Not CERTIFIED. G6 not self-issued.

evidence_policy_id: ind-soc-002-evidence-v1
catalogue_id: IND-SOC-002
version: "0.2.0-odisha-sample"
immutable_after_publish: true
invented_statutory_policy_forbidden: true
policy_input_required: false
policy_source_url: "https://edistrict.odisha.gov.in/"

required_evidence_count_min: 1

accepted_evidence_types:
  - type_id: ELECTRICITY_BILL
    display_name: "Electricity Bill"
    technical_acceptance_rules:
      max_size_mb: 5
      allowed_mime: [application/pdf, image/jpeg, image/png]
    business_verification_required: true
  - type_id: ROR_COPY
    display_name: "Copy of ROR"
    technical_acceptance_rules:
      max_size_mb: 5
      allowed_mime: [application/pdf, image/jpeg, image/png]
    business_verification_required: true
