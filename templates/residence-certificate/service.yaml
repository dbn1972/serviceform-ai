# IND-SOC-002 — Residence Certificate Service Metadata
# Sample resolved from Odisha e-District public Resident Certificate
# (https://edistrict.odisha.gov.in/). DigiLocker/DLT remain SAMPLE_LAB.
# Not CERTIFIED. G6 not self-issued. Constitution §1 §2 §3 §8 §30 §34.

catalogue_id: IND-SOC-002
record_type: service_template
version: "0.2.0-odisha-sample"
status: SAMPLE_CANDIDATE
policy_source_url: "https://edistrict.odisha.gov.in/"

metadata:
  title: "Residence Certificate"
  description: >
    Digital residence (Resident) certificate issued by a competent Tahasil authority
    attesting that an individual is ordinarily resident within a specified jurisdiction
    in Odisha, as published on the state e-District portal.
  category: social_welfare
  tags: [residence, domicile, address, certificate, odisha, ortps]

policy_fields:
  legal_basis: "ORTPSA/ORTPS notified Resident Certificate — Revenue & Disaster Management Department (edistrict.odisha.gov.in)"
  issuing_authority_class: "Tahasildar"
  eligibility_summary: >
    Continuous residence of at least one year within the concerned Tahasil;
    relaxations for transferred government employees and women married within the past one year.
  applicant_scope: "Person residing within the concerned Tahasil jurisdiction in Odisha"
  validity_period_days: "SAMPLE_LAB_UNSPECIFIED_ON_PORTAL"
  residence_proof_requirements: "Any one/more documents listed on edistrict.odisha.gov.in Resident Certificate page"
  pilot_state_or_jurisdiction: "IN-OD"

offering:
  offering_id: "IND-SOC-002-OFFERING-V1"
