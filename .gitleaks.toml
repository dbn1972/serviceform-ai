# Secret scanning config (SECURITY.md: secret scanning in CI). Extends the default rule set.
title = "ServiceForm AI gitleaks config"

[extend]
useDefault = true

[[rules]]
id = "serviceform-connection-string-password"
description = "Database/cache URL with an inline password"
regex = '''(?i)\b(postgres(ql)?|redis|amqp|mongodb)://[^:\s/]+:[^@\s/]{6,}@'''
tags = ["password", "url"]

[allowlist]
description = "Synthetic identifiers, lockfiles, and contract example fixtures (RFC4122 UUIDs in examples are not secrets; gitleaks git scans history)"
paths = [
  '''pnpm-lock\.yaml''',
  '''apps/mobile/pubspec\.lock''',
  '''MANIFEST\.sha256''',
  '''orchestrator/contracts-lock\.yaml''',
  '''contracts/shared/examples/''',
]
