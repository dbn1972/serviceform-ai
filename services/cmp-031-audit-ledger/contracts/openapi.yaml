openapi: 3.0.3
info:
  title: CMP-031 Audit and Evidence Ledger
  version: '1'
paths:
  /v1/internal/audit-events:
    post:
      operationId: submitAuditEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../../contracts/shared/schemas/audit-event.schema.json'
      responses:
        '201':
          description: Stored
        '200':
          description: Duplicate same content
        '429':
          description: Rate limit exceeded (SF-RATE-001)
  /v1/audit:
    get:
      operationId: listAudit
      parameters:
        - in: query
          name: from
          required: true
          schema: { type: string, format: date-time }
        - in: query
          name: to
          required: true
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Page of audit items
        '429':
          description: Rate limit exceeded (SF-RATE-001)
  /v1/audit/{resourceType}/{id}:
    get:
      operationId: listAuditByResource
      parameters:
        - in: path
          name: resourceType
          required: true
          schema: { type: string }
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Page of audit items
        '429':
          description: Rate limit exceeded (SF-RATE-001)
