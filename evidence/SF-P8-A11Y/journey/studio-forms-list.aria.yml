- main:
  - heading "Forms designer" [level=1]
  - paragraph: Design application forms visually. Each version compiles to a CMP-009 FORM package (JSON Schema + UX4G layout), is frozen in CMP-033 and pinned by its content hash. A form goes live only when a different officer approves the service binding that pins it.
  - text: CMP-009 · CMP-033 · CMP-051 · CMP-052 SAMPLE_LAB · not CERTIFIED
  - link "Forms product KPIs":
    - /url: /forms/metrics
  - heading "Start a blank form" [level=2]
  - paragraph: One step and an empty section
  - paragraph: Add fields from the palette, including common government fields bound to canonical semantic elements.
  - link "New blank form":
    - /url: /forms/designer
  - heading "Open a saved draft" [level=2]
  - paragraph: CMP-033 FORM documents
  - text: CMP-033 document id
  - textbox "CMP-033 document id"
  - button "Open draft"
  - paragraph: Drafts you save are listed here (ids only, kept in this browser).
  - heading "Start from a catalogue template" [level=2]
  - paragraph: The designer opens a new version
  - table "Versioned certificate templates":
    - caption: Versioned certificate templates
